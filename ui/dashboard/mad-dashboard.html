<fxs-subsystem-frame class="mad-frame mad-show-all pointer-events-auto" tabindex="-1">
	<div class="flex flex-col items-center" data-slot="header">
		<fxs-header class="mad-title tracking-100 justify-center flex" title="LOC_MAD_HEADER" data-slot="header"></fxs-header>
		<div class="mad-subtitle" data-l10n-id="LOC_MAD_SUBHEADER"></div>
	</div>

	<!-- Vitals strip: Q3 (am I tall?) then the tier heartbeat -->
	<div class="mad-vitals">
		<div class="mad-status"></div>
		<div class="mad-status-detail"></div>
		<div class="mad-pop"></div>
		<div class="mad-happy"></div>
		<div class="mad-impact"></div>
	</div>

	<!-- Filter row -->
	<div class="mad-filters">
		<fxs-activatable class="mad-filter mad-filter-all mad-filter-on"><span data-l10n-id="LOC_MAD_FILTER_ALL"></span></fxs-activatable>
		<fxs-activatable class="mad-filter mad-filter-active"><span data-l10n-id="LOC_MAD_FILTER_ACTIVE"></span></fxs-activatable>
		<fxs-activatable class="mad-filter mad-filter-locked"><span data-l10n-id="LOC_MAD_FILTER_LOCKED"></span></fxs-activatable>
		<span class="mad-counts"></span>
		<span class="mad-spacer"></span>
		<fxs-activatable class="mad-tree-btn mad-expand-all"><span data-l10n-id="LOC_MAD_EXPAND_ALL"></span></fxs-activatable>
		<fxs-activatable class="mad-tree-btn mad-collapse-all"><span data-l10n-id="LOC_MAD_COLLAPSE_ALL"></span></fxs-activatable>
	</div>

	<!-- The catalog -->
	<fxs-scrollable class="mad-scroll">
		<div class="mad-lanes"></div>
		<div class="mad-locked-empty" style="display: none;"></div>
	</fxs-scrollable>

	<div class="mad-draft-note" data-l10n-id="LOC_MAD_DRAFT_NOTE"></div>
</fxs-subsystem-frame>
